<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Single Page PDF</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <h1>Single Page PDF</h1>
    <p class="hint">Choose exact region with left/right/top/bottom and export one-page PDF.</p>

    <div class="coord-grid">
      <div class="coord-item">
        <label class="field" for="leftPx">Left (px)</label>
        <input id="leftPx" type="number" min="0" step="1" />
      </div>
      <div class="coord-item">
        <label class="field" for="rightPx">Right (px)</label>
        <input id="rightPx" type="number" min="1" step="1" />
      </div>
      <div class="coord-item">
        <label class="field" for="topPx">Top (px)</label>
        <input id="topPx" type="number" min="0" step="1" />
      </div>
      <div class="coord-item">
        <label class="field" for="bottomPx">Bottom (px)</label>
        <input id="bottomPx" type="number" min="1" step="1" />
      </div>
    </div>

    <p class="meta" id="regionMeta">Region size: -- x --</p>

    <label class="field" for="saveAs">
      <input id="saveAs" type="checkbox" checked />
      Ask file name before save
    </label>

    <button id="selectRangeBtn" type="button" class="secondary">Start Scroll Range Selection</button>
    <button id="refreshBtn" type="button" class="secondary">Refresh Current Bounds</button>
    <button id="exportBtn" type="button">Export Current Tab</button>
    <p id="status" class="status" aria-live="polite"></p>

    <details class="tips">
      <summary>Notes</summary>
      <ul>
        <li>Works best on fully loaded pages.</li>
        <li>For local file pages, enable extension access to file URLs in extension details.</li>
      </ul>
    </details>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
