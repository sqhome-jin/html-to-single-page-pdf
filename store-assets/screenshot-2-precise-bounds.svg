<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F8FF"/>
      <stop offset="1" stop-color="#E7FFF5"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg2)"/>
  <text x="80" y="78" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Precise Bounds Control</text>
  <text x="80" y="118" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22">Fine-tune left, right, top, and bottom before exporting.</text>
  <rect x="80" y="160" width="470" height="560" rx="30" fill="rgba(255,255,255,0.7)" stroke="#D5E0EF" stroke-width="2"/>
  <text x="118" y="215" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Single Page PDF</text>
  <text x="118" y="255" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="18">Choose exact region with left/right/top/bottom.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A">
    <text x="118" y="320">Left (px)</text>
    <rect x="118" y="336" width="160" height="52" rx="14" fill="#FFFFFF" stroke="#D7E1F0"/>
    <text x="185" y="369" text-anchor="middle">0</text>
    <text x="320" y="320">Right (px)</text>
    <rect x="320" y="336" width="160" height="52" rx="14" fill="#FFFFFF" stroke="#D7E1F0"/>
    <text x="400" y="369" text-anchor="middle">960</text>
    <text x="118" y="438">Top (px)</text>
    <rect x="118" y="454" width="160" height="52" rx="14" fill="#FFFFFF" stroke="#D7E1F0"/>
    <text x="198" y="487" text-anchor="middle">120</text>
    <text x="320" y="438">Bottom (px)</text>
    <rect x="320" y="454" width="160" height="52" rx="14" fill="#FFFFFF" stroke="#D7E1F0"/>
    <text x="400" y="487" text-anchor="middle">1780</text>
  </g>
  <text x="118" y="560" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="18">Region size: 960px x 1660px</text>
  <rect x="118" y="595" width="362" height="52" rx="26" fill="#0A84FF"/>
  <text x="299" y="628" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Export Current Tab</text>
  <rect x="610" y="160" width="590" height="560" rx="30" fill="#FFFFFF" stroke="#D5E0EF" stroke-width="2"/>
  <rect x="700" y="220" width="370" height="390" rx="24" fill="rgba(52,199,89,0.04)" stroke="#34C759" stroke-width="5"/>
  <text x="720" y="680" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20">Exact bounds for clean, single-page PDF export.</text>
</svg>
